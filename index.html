<!DOCTYPE html>
<html>
<head>
<title>Happy Valentine's Day</title>

<style>
body{
text-align:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
font-family:sans-serif;
overflow:hidden;
height:100vh;
}

h1{
color:white;
margin-top:80px;
font-size:38px;
}

h2{color:white;}

button{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:12px;
margin:15px;
cursor:pointer;
transition:0.3s;
}

.yes{
background:#ff4d6d;
color:white;
box-shadow:0 0 20px #ff4d6d;
}

.yes:hover{
transform:scale(1.1);
}

.no{
background:white;
color:#ff4d6d;
position:absolute;
}

.heart{
position:absolute;
font-size:20px;
animation:float 5s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}
</style>
</head>

<body>

<h1>💖 Happy Valentine's Day 💖</h1>
<h2>I really like you ❤️<br>Will you be my Valentine?</h2>

<button class="yes" onclick="love()">YES ❤️</button>
<button class="no" id="noBtn">NO 😢</button>

<!-- background music -->
<audio autoplay loop>
<source src="https://youtu.be/r3oAMDsC-8Y?si=_op0NrjOL2H5qMEn">
</audio>

<script>

// YES button
function love(){
alert("Yay!!! You made my day 💖✨");
confetti();
}

// Confetti
function confetti(){
for(let i=0;i<150;i++){
let c=document.createElement("div");
c.innerHTML="🎉";
c.style.position="absolute";
c.style.left=Math.random()*100+"%";
c.style.top=Math.random()*100+"%";
c.style.fontSize="25px";
document.body.appendChild(c);
}
}

// Floating hearts
setInterval(()=>{
let h=document.createElement("div");
h.innerHTML="❤️";
h.className="heart";
h.style.left=Math.random()*100+"%";
document.body.appendChild(h);
},400);

// Moving NO button
let no=document.getElementById("noBtn");
no.addEventListener("mouseover",()=>{
no.style.top=Math.random()*80+"%";
no.style.left=Math.random()*80+"%";
});
</script>

</body>
</html>
