<!DOCTYPE html>
<html>
<head>
<title>Happy Valentine's Day ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(45deg,#ff4e8a,#ff9a9e);
  font-family:Arial;
  color:white;
  text-align:center;
  overflow:hidden;
}

.card{
  background:rgba(255,255,255,0.15);
  padding:40px;
  border-radius:20px;
  backdrop-filter:blur(10px);
  animation:float 3s infinite ease-in-out;
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0);}
}

h1{font-size:40px;}
p{font-size:20px;}
</style>

</head>

<body>

<div class="card">
<h1>❤️ Happy Valentine's Day ❤️</h1>

<p>
You are someone very special to me.<br><br>

I really like you and I hope<br>
you will be my Valentine. 💕<br><br>

Will you be my Valentine?
</p>

</div>

</body>
</html>
