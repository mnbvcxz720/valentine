<!DOCTYPE html>
<html>
<head>
<title>Happy Valentine's Day ❤️</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(45deg,#ff4e8a,#ff9a9e);
  font-family:Arial;
  color:white;
  text-align:center;
  overflow:hidden;
}

.card{
  background:rgba(255,255,255,0.15);
  padding:40px;
  border-radius:20px;
  backdrop-filter:blur(10px);
}

button{
  padding:15px 30px;
  border:none;
  border-radius:10px;
  font-size:18px;
  margin:10px;
  cursor:pointer;
}

.yes{background:#ff2e63;color:white;}
.no{background:gray;color:white;}

#gallery{
  display:none;
  position:absolute;
  width:100%;
  height:100%;
  background:black;
}

#gallery img{
  max-width:80%;
  max-height:80%;
  margin-top:60px;
  border-radius:15px;
}
</style>
</head>
<body>

<!-- Love Message -->
<div class="card" id="message">
<h1>❤️ Happy Valentine's Day ❤️</h1>
<p>
You are someone very special to me.<br><br>
Will you be my Valentine? 💕
</p>

<button class="yes" onclick="showGallery()">YES 💖</button>
<button class="no">NO 😢</button>
</div>

<!-- Photo Gallery -->
<div id="gallery">
<h2>Our Beautiful Memories ❤️</h2>
<img id="slide" src="IMG-20260128-WA0001.jpg">
</div>
}

 <audio id="music" autoplay loop>
 <source src="Eppadi Vandhaayo - Video Song _ Aaromaley _  Kishen Das, Shivathmika, Harshath Khan _ Siddhu Kumar.mp3" type="audio/mpeg">
 </audio>
  
<script>
// your uploaded pictures here
let photos=[
  "Screenshot_20260214_143104_Instagram.jpg",
  "Screenshot_20260214_143116_Instagram.jpg",
  "Screenshot_20260214_143133_Instagram.jpg",
  "Screenshot_20260214_143036_Instagram.jpg",
  "Screenshot_20260214_143002_Instagram.jpg",
  "Screenshot_20260214_143020_Instagram.jpg",
  "Screenshot_20260214_142942_Instagram.jpg"
];

let index=0;

// when YES clicked
function showGallery(){
  document.getElementById("message").style.display="none";
  document.getElementById("gallery").style.display="block";
  startSlideshow();
}
  
// Moving NO button
let no=[
  document.getElementById("noBtn");
  no.addEventListener("mouseover",()=>{
  no.style.top=Math.random()*80+"%";
  no.style.left=Math.random()*80+"%";
}
  
// slideshow function
function startSlideshow(){
  setInterval(()=>{
    index=(index+1)%photos.length;
    document.getElementById("slide").src=photos[index];
  },3000); // change every 3 seconds
}
</script>

</body>
</html>
