<!DOCTYPE html>
<html>
<head>
<title>Happy Valentine's Day ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(45deg,#ff4e8a,#ff9a9e);
  font-family:Arial;
  color:white;
  text-align:center;
  overflow:hidden;
}

.card{
  background:rgba(255,255,255,0.15);
  padding:40px;
  border-radius:20px;
  backdrop-filter:blur(10px);
}

button{
  padding:15px 30px;
  border:none;
  border-radius:10px;
  font-size:18px;
  margin:10px;
  cursor:pointer;
}

.yes{background:#ff2e63;color:white;}
.no{background:gray;color:white;}

#gallery{
  display:none;
  position:absolute;
  width:100%;
  height:100%;
  background:black;
}

#gallery img{
  max-width:80%;
  max-height:80%;
  margin-top:60px;
  border-radius:15px;
}
</style>

</head>

<body>

<!-- Love Message -->
<div class="card" id="message">
<h1>❤️ Happy Valentine's Day ❤️</h1>

<p>
You are someone very special to me.<br><br>
Will you be my Valentine? 💕
</p>

<button class="yes" onclick="showGallery()">YES 💖</button>
<button class="no">NO 😢</button>

</div>

<!-- Photo Gallery -->
<div id="gallery">
<h2>Our Beautiful Memories ❤️</h2>
<img id="slide" src="pic1.jpg">
</div>

<script>

// your pictures here
let photos=[
"pic1.jpg",
"pic2.jpg",
"pic3.jpg",
];

let index=0;

// when YES clicked
function showGallery(){
  document.getElementById("message").style.display="none";
  document.getElementById("gallery").style.display="block";

  startSlideshow();
}

// slideshow function
function startSlideshow(){
  setInterval(()=>{
    index=(index+1)%photos.length;
    document.getElementById("slide").src=photos[index];
  },3000); // change every 3 seconds
}

</script>

</body>
  <audio id="music" loop>
  <source src="love.mp3" type="audio/mpeg">
</audio>

<script>
document.addEventListener("click", function(){
  document.getElementById("music").play();
});

</html>
